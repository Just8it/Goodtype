[workspace]
resolver = "3"
members = [
  "apps/desktop/src-tauri",
  "crates/goodtype-core",
  "crates/goodtype-typst",
  "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
