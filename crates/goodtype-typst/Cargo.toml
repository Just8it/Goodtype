[package]
name = "goodtype-typst"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The Typst compiler is embedded in-process; there is no external `typst` binary.
[dependencies]
goodtype-core = { path = "../goodtype-core" }
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
unicode-width = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
tempfile.workspace = true
typst = "0.15.1"
# In-process completion and analysis, driven by the same World as compilation.
typst-ide = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-svg = "0.15.1"
# PNG renders for the AI helper, ADR 0041.
typst-render = "0.15.1"
# Formatting is independent of language analysis; use the small library instead of Tinymist.
typstyle-core = "0.15.0"
# Typst Universe packages, offline-first. Same loader typst-cli uses.
typst-kit = { version = "0.15.1", default-features = false, features = [
    # Bundled fonts plus the fonts installed on this computer (ADR 0030), read-only.
    "embedded-fonts",
    "scan-fonts",
    "system-downloader",
    "system-packages",
    "universe-packages",
] }

[dev-dependencies]
# SVG raster comparison independently checks helper PNG composition (ADR 0041).
resvg = "0.47.0"
