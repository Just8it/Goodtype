[package]
name = "goodtype-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The AI helper relay (ADR 0041): an authenticated byte pump between an assistant's stdio and the
# running Goodtype app's named pipe. It has no notebook or filesystem authority and no MCP logic.
[[bin]]
name = "goodtype-mcp"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Win32_System_IO",
  "Win32_System_Threading",
] }
