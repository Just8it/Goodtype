<!--
  Goodtype app icon at small sizes (16-32px).

  A page with one handwritten stroke above two lines of set type. Teal is only ever the
  handwritten part; ink-grey is only ever set type. Never tint the page outline or the set lines
  teal — that colour rule is the whole idea of the mark, and the product follows it too: teal
  means "your hand" wherever it appears.

  Clear space on all sides equals the page's corner radius.

  The page survives; the set lines do not. This used to be the stroke alone, on the reasoning
  that a smudged page reads worse than no page — but a bare wave with nothing around it is not
  this mark, it is an audio waveform, which is exactly what the icon got mistaken for. The page
  is what makes it a notebook, so it is kept and thickened rather than dropped, and the type goes
  instead: at 16px two 1px bars are the smudge, not the page.

  The hand is scaled up about its own centre to fill the page, because a stroke at true
  proportion is a thread at this size.

  `cargo xtask icons` rasterises this into the PNG and ICO set Tauri needs. Edit the SVG,
  never the bitmaps.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none" role="img" aria-label="Goodtype">
  <rect width="1024" height="1024" rx="225.0" fill="#1497A6"/>
  <g transform="translate(20.48 181.17) scale(9.4523)">
    <rect x="6" y="6" width="92" height="58" rx="7" stroke="#FCFCFA" stroke-width="8"/>
    <path d="M18 30 C 24 18, 30 18, 34 28 C 37 35, 41 35, 45 26 C 48 19, 53 19, 57 24 C 60 28, 64 28, 67 23"
          transform="translate(52 35) scale(1.28) translate(-42.5 -26.5)"
          stroke="#0C4A52" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
